services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: igreja_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - igreja_db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3333
      DATABASE_URL: postgres://postgres:postgres@db:5432/igreja_db
      JWT_SECRET: ${JWT_SECRET:-troque-este-valor-por-um-segredo-forte}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:8081}
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:3333/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:3333/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  igreja_db_data:
